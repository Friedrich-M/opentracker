name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tracker:tracker@localhost:5432/tracker
      SKIP_BUILD_GEO: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Create disposable test secrets
        run: |
          node --input-type=module <<'JS'
            import { appendFileSync } from "node:fs";
            import { randomBytes } from "node:crypto";
            for (const key of ["APP_SECRET", "TWO_FACTOR_ENCRYPTION_KEY"]) {
              appendFileSync(process.env.GITHUB_ENV, `${key}=${randomBytes(32).toString("hex")}\n`);
            }
          JS
      - name: Verify source, types and tests
        run: pnpm verify
      - name: Check lint, unused code and translations
        run: pnpm check:quality
      - name: Apply migrations and build production app
        run: pnpm build
      - name: Check dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Check generated source drift
        run: |
          pnpm build:tracker:types
          git diff --exit-code
