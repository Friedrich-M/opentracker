name: Feature request
description: Describe a problem and a proposed improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome, alternatives and any privacy implications.
    validations:
      required: true
