name: Bug report
description: Report a reproducible problem with synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, visitor data, replay recordings or private deployment details. Follow SECURITY.md for vulnerabilities.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or version, Node and pnpm versions, PostgreSQL version, OS and browser. Omit instance URLs and account IDs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a disposable instance and synthetic data. Include a minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted error messages or screenshots only when useful.
    validations:
      required: true
