allowBuilds:
  # embedded-postgres (pnpm db:local): postinstall only links bundled libraries.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  esbuild: false
  msw: false
  prisma: true
  sharp: false
  # workerd (Cloudflare build preview): postinstall checks its platform binary.
  workerd: true
minimumReleaseAgeExclude:
  - '@umami/react-zen'
  - cn@0.2.6

# Security floors for transitive dependencies whose parents still allow affected versions.
overrides:
  '@babel/core@<7.29.6': 7.29.6
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'browserslist@<4.28.7': 4.28.7
  'd3-color@<3.1.0': 3.1.0
  'deepmerge-ts@<8.0.0': 8.0.2
  'esbuild@>=0.27.3 <0.28.1': 0.28.2
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'fflate@>=0.4.5 <0.4.9': 0.4.9
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'minimatch@<3.1.4': 3.1.4
  'minimatch@>=5.0.0 <5.1.8': 5.1.8
  'minimatch@>=9.0.0 <9.0.7': 9.0.7
  'mysql2@<3.23.1': 3.23.1
  'picomatch@>=4.0.0 <4.0.4': ^4.0.4
  'shell-quote@<1.11.0': 1.11.0
  'svgo@>=3.0.0 <3.3.5': 3.3.5
  'vite@>=8.0.0 <8.0.16': 8.0.16
  'source-map-js@<1.2.2': 1.2.2
  'sharp@<0.35.5': 0.35.5
  'undici@>=8.0.0 <8.10.2': 8.10.2
  'postcss-selector-parser@<7.1.6': 7.1.6
